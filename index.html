<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTP VocaBuddy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6f5;margin:0;padding:24px;text-align:center}
  h1{color:#0f766e}
  #stats{color:#666;font-size:.95rem}
  #card{max-width:340px;margin:24px auto 8px;padding:36px 24px;background:#fff;border-radius:14px;
        box-shadow:0 4px 16px rgba(0,0,0,.08);font-size:2rem;user-select:none}
  #meaning{color:#0f766e;font-size:1.2rem;min-height:1.6em}
  button{margin:8px 6px 0;padding:10px 22px;font-size:1rem;border:none;border-radius:8px;
         background:#0f766e;color:#fff;cursor:pointer}
  button.warn{background:#b3403a}
</style>
</head>
<body>
<h1>YTP VocaBuddy Pro 2.0</h1>
<p id="stats"></p>
<div id="card">—</div>
<p id="meaning">&nbsp;</p>
<p id="ai" style="max-width:340px;margin:8px auto;color:#555"></p>
<div>
  <button id="reveal" onclick="reveal()">顯示答案</button>
  <button id="ok" onclick="mark(true)" hidden>記得 ✓</button>
  <button id="no" onclick="mark(false)" class="warn" hidden>忘了 ✗</button>
  <button id="aiBtn" onclick="aiExample()" hidden>AI 例句</button>
</div>
<div style="margin-top:24px">
  <button onclick="smartQuiz()">考我弱點</button>
</div>
<div id="quiz" style="max-width:340px;margin:8px auto;color:#333"></div>
<script src="words.js"></script>
<script src="srs.js"></script>
<script>
// 學習紀錄：只屬於這台裝置，所以放 localStorage（讀寫都包 try/catch）
let log = {};
try { log = JSON.parse(localStorage.getItem("vb-log")) || {}; } catch(e){}
function save(){ try { localStorage.setItem("vb-log", JSON.stringify(log)); } catch(e){} }

// —— 日期：以「第幾天」為單位，附時間旅行測試器 ——
let dayOffset = 0;
try { dayOffset = +localStorage.getItem("vb-day") || 0; } catch(e){}
// 本地日：直接除 864e5 得到的是 UTC 日，台灣要等到早上 8 點才換日，時間旅行會看不懂
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5) + dayOffset;
window.vbTravel = n => {            // Console 輸入 vbTravel(1) 即快轉一天
  try { localStorage.setItem("vb-day", dayOffset + n); } catch(e){}
  location.reload();
};

function stateOf(w){
  const s = log[w.en] || (log[w.en] = { seen:0, wrong:0 });
  if (s.box === undefined){ s.box = 1; s.due = today(); }   // 舊紀錄自動升級
  return s;
}

let queue = WORDS.filter(w => stateOf(w).due <= today());   // 只複習「到期」的卡
let cur = null;

const $ = id => document.getElementById(id);

function next(){
  stats();                      // 擺第一行：清空那條分支也要更新上方的計數
  $("aiBtn").hidden = true;     // 換卡就收起 AI 例句
  $("ai").textContent = "";
  if (queue.length === 0){
    $("card").textContent = "今天沒有到期的卡——明天見！";
    $("meaning").innerHTML = "&nbsp;";
    $("reveal").hidden = $("ok").hidden = $("no").hidden = true;
    return;
  }
  cur = queue[0];
  $("card").textContent = cur.en;
  $("meaning").innerHTML = "&nbsp;";
  $("reveal").hidden = false;
  $("ok").hidden = $("no").hidden = true;
}

function reveal(){
  $("meaning").textContent = cur.zh;
  $("reveal").hidden = true;
  $("ok").hidden = $("no").hidden = false;
  $("aiBtn").hidden = false;    // 先自己回想、翻面後才給 AI 例句
}

function mark(ok){
  const s = stateOf(cur);
  s.seen++; if (!ok) s.wrong++;
  const r = schedule(s.box, ok, today());   // ← 排程交給純函式
  s.box = r.box; s.due = r.due;
  save();
  if (ok) queue.shift();
  else queue.push(queue.shift());   // 忘了的排到今天隊尾，等一下再考一次
  next();
}

function stats(){
  $("stats").textContent = "今日佇列：剩 " + queue.length + " 張";
}

// AI 例句：教材原版是瀏覽器直呼 Claude API（使用者自帶金鑰）。
// 目前沒有 key，先改呼叫本機 Ollama——只有開著 Ollama 的這台電腦有例句，
// 其他人看到的是降階訊息，複習流程不受影響。
const LOCAL_URL = "http://localhost:11434/api/chat";
const LOCAL_MODEL = localStorage.getItem("vb-ollama-model") || "qwen3.5:4b";  // 預設 4b，可在 Console 自訂
const EXAMPLE_SYSTEM = '你是高中英語老師。只輸出 JSON：{"sentence":"...","zh":"...","tip":"..."}，不要 markdown 圍欄，不要其他文字。';

// 共用的 AI 呼叫：給 system 與 user 兩段提示，回傳模型的文字（例句與出題都用它）
// 換回 Claude 時只要改這個函式（教材的 callClaude）
async function callAI(system, user){
  const res = await fetch(LOCAL_URL, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      model: LOCAL_MODEL,
      stream: false,
      think: false,                  // qwen3.5 預設先思考，實測慢 20 倍
      format: "json",                // Ollama 端的結構化輸出：保證回的是合法 JSON
      messages: [{ role: "system", content: system },
                 { role: "user", content: user }]
    })
  });
  if (!res.ok) throw new Error("Ollama 回應 " + res.status);
  return (await res.json()).message.content;
}

async function aiExample(){
  const word = cur.en, box = $("ai");
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem("vb-ai")) || {}; } catch(e){}
  if (cache[word]) return show(cache[word]);        // 快取命中：不呼叫模型、離線可用
  box.textContent = "生成中…（本機模型約 10 秒）";
  $("aiBtn").disabled = true;
  try {
    const c = JSON.parse(await callAI(EXAMPLE_SYSTEM, "用單字 " + word + " 造一個 CEFR B1 例句、中譯與聯想"));
    if (typeof c.sentence !== "string" || !c.sentence.toLowerCase().includes(word.toLowerCase()))
      throw new Error("例句沒包含目標單字");
    cache[word] = c;
    try { localStorage.setItem("vb-ai", JSON.stringify(cache)); } catch(e){}
    show(c);
  } catch (e) {
    if (cur && cur.en === word)
      box.textContent = "AI 暫時不可用——不影響複習，例句之後再補。";
  } finally {
    $("aiBtn").disabled = false;
  }
  function show(c){
    if (!cur || cur.en !== word) return;           // 生成期間已換卡：結果留在快取，不蓋到別張卡上
    box.textContent = "";                        // 模型輸出一律當「文字」，不當 HTML
    const em = document.createElement("em");
    em.textContent = c.sentence;
    box.append(em, document.createElement("br"),
               c.zh, document.createElement("br"), "聯想：" + c.tip);
  }
}

// —— 弱點檢索：按錯誤率排序取前 k 名（RAG-lite 的 Retrieval）——
function weakest(k){
  return WORDS
    .map(w => { const s = log[w.en] || {seen:0, wrong:0};
                return { en: w.en, zh: w.zh, rate: s.wrong / (s.seen || 1) }; })
    .sort((a, b) => b.rate - a.rate)
    .slice(0, k);
}

// —— 智慧出題：檢索出的弱字塞進 prompt，讓 AI 針對它們出題 ——
async function smartQuiz(){
  const t = weakest(3);
  const box = $("quiz");
  box.textContent = "出題中…（本機模型約 10 秒）";
  try {
    const text = await callAI(
      '你是出題老師。只輸出 JSON：{"question":"...","options":["..","..","..",".."],' +
      '"answer":"..","why":".."}。question 是含 ____ 的英文克漏字句。',
      "使用者最常錯的單字：" + t.map(w => w.en + "（" + w.zh + "）").join("、") +
      "。從中挑一個出一題四選一，選項要包含正確答案與三個貼近的干擾項。");
    const q = JSON.parse(text);
    // 把模型回的答案對回單字包裡的本尊：大小寫不同、或根本不是你的單字，都不出題
    const hit = t.find(w => w.en.toLowerCase() === String(q.answer || "").toLowerCase());
    if (!Array.isArray(q.options) || q.options.length !== 4 ||
        !q.options.includes(q.answer) || !hit) throw new Error("題目格式不合格");
    box.textContent = "";                                 // 模型輸出當文字，不當 HTML
    const p = document.createElement("p");
    p.textContent = q.question;
    box.appendChild(p);
    q.options.forEach(op => {
      const b = document.createElement("button");
      b.textContent = op;
      b.onclick = () => {
        box.querySelectorAll("button").forEach(x => x.disabled = true);   // 一題只記一次
        const ok = op === q.answer;
        const s = log[hit.en] || (log[hit.en] = {seen:0, wrong:0});   // 鍵用本尊，不用模型字串
        s.seen++; if (!ok) s.wrong++;                     // 答題結果寫回紀錄：閉環
        save();
        const r = document.createElement("p");
        r.textContent = ok ? "答對！" + q.why : "正解：" + q.answer + "。" + q.why;
        box.appendChild(r);
      };
      box.appendChild(b);
    });
  } catch (e) {
    box.textContent = "AI 暫時不可用，先用單字卡複習吧。";
  }
}

next();

// 註冊 service worker
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});   // file:// 開啟時不註冊也不噴錯
</script>
</body>
</html>
