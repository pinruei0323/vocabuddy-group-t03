<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YTP VocaBuddy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5e57">
<style>
  /* 設計概念：深青色書桌 + 紅線藍格的索引卡 + 螢光筆黃的重點 */
  :root{--desk:#0b5e57;--paper:#fbfaf6;--rule:#cfe3ea;--ink:#12312e;--mark:#ffd84d;--good:#2f9e6a;--bad:#d9473a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
       background:var(--desk);color:#eaf5f2;text-align:center;
       font:16px/1.55 ui-rounded,"SF Pro Rounded",system-ui,"PingFang TC","Noto Sans TC",sans-serif}
  main{max-width:440px;margin:0 auto}
  h1{margin:6px 0 2px;font-size:1.3rem;font-weight:800}
  h1 small{margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--mark);color:var(--ink);font-size:.7rem;vertical-align:2px}
  #stats{margin:0 0 8px;font-size:.9rem;opacity:.8}
  .bar{height:6px;border-radius:9px;background:#ffffff2e;overflow:hidden}
  .bar i{display:block;width:0;height:100%;background:var(--mark);transition:width .4s}

  /* 單字卡：頂端紅線、底下藍色橫格，像真的索引卡 */
  #card{margin:22px 0 14px;padding:54px 22px 46px;min-height:170px;display:flex;align-items:center;justify-content:center;
        color:var(--ink);border-radius:10px;box-shadow:0 14px 28px -12px #0008;user-select:none;word-break:break-word;
        font:800 clamp(2.1rem,10vw,3rem)/1.15 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:-.01em;
        background:linear-gradient(var(--bad),var(--bad)) 0 31px/100% 2px no-repeat,
                   repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px),var(--paper)}
  #card.pop{animation:pop .3s ease-out}
  #card.done{font-size:1.3rem;line-height:1.6}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}}

  /* 中文意思：螢光筆黃的便利貼 */
  #meaning{width:fit-content;min-height:1.9em;margin:0 auto;padding:2px 16px;border-radius:6px;font-size:1.2rem;font-weight:700}
  #meaning.on{background:var(--mark);color:var(--ink);transform:rotate(-1deg)}
  #ai{margin:14px 0 0;padding:10px 14px;text-align:left;font-size:.92rem;color:var(--ink);
      background:var(--paper);border-left:4px solid var(--mark);border-radius:6px}
  #ai:empty{display:none}

  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .btn{padding:11px 22px;border:0;border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.main{background:var(--mark)}
  .btn.ok{background:#8be0b3}
  .btn.warn{background:#ff9b8a}
  .btn.ghost{background:transparent;color:#eaf5f2;box-shadow:inset 0 0 0 2px #ffffff55}
  :focus-visible{outline:3px solid var(--mark);outline-offset:2px}
  [hidden]{display:none!important}

  /* 弱點特訓 */
  .panel{margin-top:28px}
  #quiz{margin-top:14px;text-align:left;font-size:.95rem;opacity:.9}
  #quiz.paper{padding:16px;border-radius:10px;background:var(--paper);color:var(--ink);opacity:1;box-shadow:0 14px 28px -12px #0008}
  .q{margin:0 0 12px;font-size:1.08rem;font-weight:600}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:2px solid var(--rule);border-radius:10px;
       background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
  .opt::before{content:attr(data-k);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
               background:var(--rule);font-size:.8rem;font-weight:800}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--good);background:#e4f6ec}
  .opt.right::before{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:#fdeceb}
  .opt.wrong::before{background:var(--bad);color:#fff}
  .opt.dim{opacity:.5}
  .why{margin:12px 0;padding:10px 12px;border-left:4px solid var(--good);border-radius:6px;background:#f1f6f5;font-size:.92rem}
  .why.bad{border-color:var(--bad)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* CSV 匯入面板 */
  #csvBox{margin-top:14px}
  #csvText{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--paper);color:var(--ink);
           font:inherit;font-size:.9rem;box-shadow:0 14px 28px -12px #0008}
  #csvText:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
  #csvMsg{margin-top:10px;font-size:.88rem;text-align:left;white-space:pre-line}
  #csvMsg .bad{color:#ffb3aa}

  /* 新版本提示：底部毛玻璃藥丸（backdrop blur＋輕盈上浮，向 Apple 的通知膠囊借鏡） */
  #updateToast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:9;
    display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:99px;
    background:#0b3530d9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 32px #0007;font-size:.9rem;
    opacity:0;transform:translate(-50%,14px);transition:opacity .3s,transform .3s;pointer-events:none}
  #updateToast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #updateToast .btn{padding:8px 16px}
</style>
</head>
<body>
<main>
  <h1>YTP VocaBuddy<small>Pro 2.0</small></h1>
  <p id="stats"></p>
  <div class="bar"><i id="bar"></i></div>
  <div id="card">—</div>
  <p id="meaning">&nbsp;</p>
  <p id="ai"></p>
  <div class="row">
    <button class="btn main" id="reveal" onclick="reveal()">顯示答案</button>
    <button class="btn ok" id="ok" onclick="mark(true)" hidden>記得 ✓</button>
    <button class="btn warn" id="no" onclick="mark(false)" hidden>忘了 ✗</button>
    <button class="btn ghost" id="aiBtn" onclick="aiExample()" hidden>AI 例句</button>
  </div>
  <div class="panel">
    <button class="btn ghost" id="quizBtn" onclick="smartQuiz()">考我弱點</button>
    <button class="btn ghost" onclick="setKey()">設定 AI 金鑰</button>
    <div id="quiz"></div>
  </div>
  <div class="panel">
    <button class="btn ghost" id="csvBtn" onclick="toggleCsv()">匯入單字包 CSV</button>
    <div id="csvBox" hidden>
      <textarea id="csvText" rows="4" placeholder="en,zh 每行一個單字，可整批貼上；&#10;欄位可用雙引號包住，例如 &quot;give up&quot;,&quot;放棄&quot;"></textarea>
      <div class="row"><button class="btn main" onclick="importCsv()">匯入</button><button class="btn warn" onclick="clearImported()">清除匯入</button></div>
      <div id="csvMsg"></div>
    </div>
  </div>
</main>
<div id="updateToast" hidden role="status"><span>VocaBuddy 有新版本</span><button class="btn main" onclick="location.reload()">重新整理</button></div>
<script src="words.js"></script>
<script src="srs.js"></script>
<script src="csv.js"></script>
<script>
// 學習紀錄：只屬於這台裝置，所以放 localStorage（讀寫都包 try/catch）
let log = {};
try { log = JSON.parse(localStorage.getItem("vb-log")) || {}; } catch(e){}
function save(){ try { localStorage.setItem("vb-log", JSON.stringify(log)); } catch(e){} }

// 自訂單字（CSV 匯入，Lab 10）：存 localStorage，重新整理仍在；啟動時併入單字包
// words.js 之後若加了同樣的字，這裡把它濾掉，避免執行期出現重複單字
try {
  const mine = new Set(WORDS.map(w => w.en.toLowerCase()));
  (JSON.parse(localStorage.getItem("vb-custom")) || [])
    .filter(w => w && w.en && w.zh && !mine.has(w.en.toLowerCase()))
    .forEach(w => { WORDS.push(w); mine.add(w.en.toLowerCase()); });
} catch(e){}

// —— 日期：以「第幾天」為單位，附時間旅行測試器 ——
let dayOffset = 0;
try { dayOffset = +localStorage.getItem("vb-day") || 0; } catch(e){}
// 本地日：直接除 864e5 得到的是 UTC 日，台灣要等到早上 8 點才換日，時間旅行會看不懂
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5) + dayOffset;
window.vbTravel = n => {            // Console 輸入 vbTravel(1) 即快轉一天
  try { localStorage.setItem("vb-day", dayOffset + n); } catch(e){}
  location.reload();
};

function stateOf(w){
  const s = log[w.en] || (log[w.en] = { seen:0, wrong:0 });
  if (s.box === undefined){ s.box = 1; s.due = today(); }   // 舊紀錄自動升級
  return s;
}

let queue = WORDS.filter(w => stateOf(w).due <= today());   // 只複習「到期」的卡
let total = queue.length;                                    // 進度條的分母（CSV 匯入會再增加）
let cur = null;

const $ = id => document.getElementById(id);

function next(){
  stats();                      // 擺第一行：清空那條分支也要更新上方的計數
  $("aiBtn").hidden = true;     // 換卡就收起 AI 例句
  $("ai").textContent = "";
  $("meaning").className = "";
  $("meaning").innerHTML = "&nbsp;";
  const c = $("card");
  if (queue.length === 0){
    c.className = "done";
    c.textContent = "今天沒有到期的卡——明天見！";
    $("reveal").hidden = $("ok").hidden = $("no").hidden = true;
    return;
  }
  cur = queue[0];
  c.className = ""; void c.offsetWidth; c.className = "pop";   // 重啟換卡動畫
  c.textContent = cur.en;
  $("reveal").hidden = false;
  $("ok").hidden = $("no").hidden = true;
}

function reveal(){
  $("meaning").textContent = cur.zh;
  $("meaning").className = "on";
  $("reveal").hidden = true;
  $("ok").hidden = $("no").hidden = false;
  $("aiBtn").hidden = false;    // 先自己回想、翻面後才給 AI 例句
}

function mark(ok){
  const s = stateOf(cur);
  s.seen++; if (!ok) s.wrong++;
  const r = schedule(s.box, ok, today());   // ← 排程交給純函式
  s.box = r.box; s.due = r.due;
  save();
  if (ok) queue.shift();
  else queue.push(queue.shift());   // 忘了的排到今天隊尾，等一下再考一次
  next();
}

function stats(){
  $("stats").textContent = "今日佇列：剩 " + queue.length + " 張";
  $("bar").style.width = (total ? (total - queue.length) / total * 100 : 100) + "%";
}

// AI 例句與出題共用的後端選擇（Lab 6）：
//   有 vb-claude-key → 瀏覽器直呼 Claude API（教材標準做法，使用者自帶金鑰 BYOK，只存在自己的 localStorage）
//   沒有金鑰       → 呼叫 Ollama（團隊預設；網址與模型皆可在 Console 自訂，不必改程式碼）
const LOCAL_URL = localStorage.getItem("vb-ollama-url") || "http://100.113.111.50:11434/api/chat";
const LOCAL_MODEL = localStorage.getItem("vb-ollama-model") || "qwen3.5:9b";
const CLAUDE_MODEL = "claude-sonnet-5-5";
let CLAUDE_KEY = "";
try { CLAUDE_KEY = (localStorage.getItem("vb-claude-key") || "").trim(); } catch(e){}
if (CLAUDE_KEY === "null") CLAUDE_KEY = "";   // prompt() 按取消會被存成字串 "null"，當成沒金鑰
const EXAMPLE_SYSTEM = '你是高中英語老師。只輸出 JSON：{"sentence":"...","zh":"...","tip":"..."}，不要 markdown 圍欄，不要其他文字。';

// 用途：讓使用者自帶金鑰（BYOK）——prompt 輸入、只存這台裝置的 localStorage；留空送出＝清除、改走 Ollama；按取消＝不動
function setKey(){
  const k = prompt("輸入 Claude API 金鑰（BYOK，只存在你自己的瀏覽器，不會傳到別的地方）。\n留空送出＝清除金鑰、改用團隊 Ollama。", CLAUDE_KEY);
  if (k === null) return;
  CLAUDE_KEY = k.trim();
  if (CLAUDE_KEY === "null") CLAUDE_KEY = "";
  try { localStorage.setItem("vb-claude-key", CLAUDE_KEY); } catch(e){}
}

// 共用的 AI 呼叫：給 system 與 user 兩段提示，回傳模型的文字（例句與出題都用它）
async function callAI(system, user){
  return CLAUDE_KEY ? callClaude(system, user) : callOllama(system, user);
}

// 教材原版（Lab 6）：fetch 直呼 Messages API。
// 瀏覽器直呼必帶 dangerous-direct-browser-access 標頭——名稱就在提醒只適合自帶金鑰的個人工具。
async function callClaude(system, user){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json",
               "x-api-key": CLAUDE_KEY,
               "anthropic-version": "2023-06-01",
               "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 1024,              // 例句 JSON 約 200 tokens，留裕度給 thinking 區塊
      system,                        // 注意：Claude 不收 temperature（勘誤 E-014）
      messages: [{ role: "user", content: user }]
    })
  });
  if (!res.ok) throw new Error("Claude 回應 " + res.status);
  const data = await res.json();
  const block = (data.content || []).find(b => b.type === "text");   // 回應可能先有 thinking 區塊（E-009）
  if (!block) throw new Error("Claude 回應沒有文字區塊");
  return block.text;
}

// 團隊預設後端：Ollama
async function callOllama(system, user){
  const res = await fetch(LOCAL_URL, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      model: LOCAL_MODEL,
      stream: false,                  // Ollama 端不支援 SSE，Claude 才有
      think: true,                  // qwen3.5 預設先思考，實測慢 20 倍
      format: "json",                // Ollama 端的結構化輸出：保證回的是合法 JSON
      messages: [{ role: "system", content: system },
                 { role: "user", content: user }]
    })
  });
  if (!res.ok) throw new Error("Ollama 回應 " + res.status);
  return (await res.json()).message.content;
}

async function aiExample(){
  const word = cur.en, box = $("ai");
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem("vb-ai")) || {}; } catch(e){}
  if (cache[word]) return show(cache[word]);        // 快取命中：不呼叫模型、離線可用
  box.textContent = CLAUDE_KEY ? "生成中…" : "生成中…（本機模型約 10 秒）";
  $("aiBtn").disabled = true;
  try {
    const c = JSON.parse(await callAI(EXAMPLE_SYSTEM, "用單字 " + word + " 造一個 CEFR B1 例句、中譯與聯想"));
    if (typeof c.sentence !== "string" || !c.sentence.toLowerCase().includes(word.toLowerCase()))
      throw new Error("例句沒包含目標單字");
    cache[word] = c;
    try { localStorage.setItem("vb-ai", JSON.stringify(cache)); } catch(e){}
    show(c);
  } catch (e) {
    if (cur && cur.en === word)
      box.textContent = "AI 暫時不可用——不影響複習，例句之後再補。";
  } finally {
    $("aiBtn").disabled = false;
  }
  function show(c){
    if (!cur || cur.en !== word) return;           // 生成期間已換卡：結果留在快取，不蓋到別張卡上
    box.textContent = "";                        // 模型輸出一律當「文字」，不當 HTML
    const em = document.createElement("em");
    em.textContent = c.sentence;
    box.append(em, document.createElement("br"),
               c.zh, document.createElement("br"), "聯想：" + c.tip);
  }
}

// —— 弱點檢索：按錯誤率排序取前 k 名（RAG-lite 的 Retrieval）——
// 同分時隨機排序，避免永遠只考單字包最前面那幾個
function weakest(k){
  return WORDS
    .map(w => { const s = log[w.en] || {seen:0, wrong:0};
                return { en: w.en, zh: w.zh, rate: s.wrong / (s.seen || 1), r: Math.random() }; })
    .sort((a, b) => b.rate - a.rate || a.r - b.r)
    .slice(0, k);
}

// —— 智慧出題 ——
// 出題變笨的原因與對策：
// 1. 以前讓模型自己「從 3 個字挑一個」→ 小模型幾乎永遠挑第一個。現在改由程式挑目標字，模型只負責出題。
// 2. 以前沒講「好題目」的標準 → 句子太空泛、干擾項亂湊。現在 prompt 明列規則並附一個範例。
// 3. JSON 先寫 clue（線索）再造句：讓模型先想「靠什麼推出答案」，題目比較不會模稜兩可。
// 4. 選項順序由程式洗牌，不讓正解固定出現在同一個位置。
const QUIZ_SYSTEM = `你是台灣高中英文命題老師，出英文克漏字四選一。只輸出 JSON，不要 markdown 圍欄或其他文字，欄位依序為：
{"clue":"..","question":"..","options":["..","..","..",".."],"answer":"..","why":".."}
規則：
1. clue：先用一句中文寫出「句中讓答案唯一的線索」（因果、對比、搭配詞等），再根據它造句。
2. question：自然的英文句（CEFR B1–B2、10–20 字），含一個 ____，且目標單字的「原形」直接填入即合文法，不可變化詞形（動詞用 to ____、can ____ 之類結構）。句中不得出現目標單字本身。
3. 句子要有具體情境與線索，只有目標單字能填。禁止 I like ____. 這種什麼詞都能填的句子。
4. options：4 個英文單字，answer 是目標單字原形。另外 3 個干擾項須與目標同詞性、難度相近、容易混淆（語意相近或拼字相似），但放進句子後明確不通。不得有兩個選項都合理，不得重複，不得使用中文。
5. why：用繁體中文兩句內說明答案為什麼對，以及最像的干擾項為什麼錯。
範例（只示範格式與品質，不要照抄）：
{"clue":"but 表示對比：預期會慌張，實際上相反","question":"Everyone expected her to panic, but she stayed ____ during the whole interview.","options":["calm","curious","cruel","careless"],"answer":"calm","why":"but 帶出對比：預期慌張，實際上保持「冷靜」。curious 是好奇，和前後文語意無關。"}`;

const SCENES = ["校園生活","旅行","科技與網路","運動比賽","家人與朋友","新聞時事","環境保護","美食","工作面試","科學實驗"];
const norm = s => String(s).trim().toLowerCase();
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let lastQuiz = "";

// 向模型要一題；不合格就重試一次（網路錯誤不重試，免得白等兩倍時間）
async function makeQuiz(t){
  for (let i = 0; i < 2; i++){
    try {
      const q = JSON.parse(await callAI(QUIZ_SYSTEM,
        "目標單字：" + t.en + "（" + t.zh + "）\n情境：" + SCENES[Math.floor(Math.random() * SCENES.length)] +
        "\nanswer 必須是 " + t.en + "。"));
      const opts = Array.isArray(q.options) ? q.options.map(String) : [];
      const good = typeof q.question === "string" && q.question.split("____").length === 2   // 恰一個空格
        && opts.length === 4 && new Set(opts.map(norm)).size === 4                          // 四個不重複
        && norm(q.answer) === norm(t.en) && opts.some(o => norm(o) === norm(t.en))          // 答案是目標字本尊
        && !new RegExp("\\b" + esc(t.en) + "\\b", "i").test(q.question);                    // 題幹沒洩漏答案
      if (good) return { question: q.question, options: shuffle(opts), why: String(q.why || "") };
    } catch (e) {
      if (e instanceof TypeError || /^(Ollama|Claude)/.test(e.message)) throw e;
    }
  }
  throw new Error("題目格式不合格");
}

function renderQuiz(q, t){
  const box = $("quiz");
  box.className = "paper";
  box.textContent = "";                                   // 模型輸出當文字，不當 HTML
  const p = document.createElement("p");
  p.className = "q";
  p.textContent = q.question;
  const list = document.createElement("div");
  list.className = "opts";
  q.options.forEach((op, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.dataset.k = "ABCD"[i]; b.textContent = op;
    b.onclick = () => {
      const ok = norm(op) === norm(t.en);
      list.querySelectorAll("button").forEach(x => {      // 一題只記一次
        x.disabled = true;
        x.classList.add(norm(x.textContent) === norm(t.en) ? "right" : x === b ? "wrong" : "dim");
      });
      const s = log[t.en] || (log[t.en] = {seen:0, wrong:0});   // 鍵用單字本尊，不用模型字串
      s.seen++; if (!ok) s.wrong++;                       // 答題結果寫回紀錄：閉環
      save();
      const r = document.createElement("p");
      r.className = "why" + (ok ? "" : " bad");
      r.textContent = (ok ? "答對！" : "正解：" + t.en + "。") + " " + q.why;
      const n = document.createElement("button");
      n.className = "btn main"; n.textContent = "下一題"; n.onclick = smartQuiz;
      box.append(r, n);
    };
    list.appendChild(b);
  });
  box.append(p, list);
}

async function smartQuiz(){
  const pool = weakest(5).filter(w => w.en !== lastQuiz);        // 前五弱，且不連考同一字
  const t = pool[Math.floor(Math.random() * pool.length)] || weakest(1)[0];
  const box = $("quiz");
  box.className = "";
  box.textContent = "出題中…（兄弟你沒急吧）";
  $("quizBtn").disabled = true;
  try {
    const q = await makeQuiz(t);
    lastQuiz = t.en;
    renderQuiz(q, t);
  } catch (e) {
    box.textContent = "老子卡了，先用單字卡複習吧。";
  } finally {
    $("quizBtn").disabled = false;
  }
}

// —— CSV 匯入 UI（Lab 10）：解析與驗證都是 csv.js 的純函式，這裡只負責接畫面 ——
// 用途：展開／收合匯入區塊，展開時把焦點移到文字框，方便直接貼上
function toggleCsv(){
  $("csvBox").hidden = !$("csvBox").hidden;
  if (!$("csvBox").hidden) $("csvText").focus();
}

// 用途：把文字框的 CSV 交給純函式解析驗證，合法行併入單字包與今日佇列、錯誤行逐行回報
function importCsv(){
  const box = $("csvMsg");
  box.textContent = "";
  const { ok, errors } = validateWords(parseCSV($("csvText").value), WORDS);
  if (ok.length){
    let custom = [];
    try { custom = JSON.parse(localStorage.getItem("vb-custom")) || []; } catch(e){}
    ok.forEach(w => { WORDS.push(w); custom.push(w); });      // 併入單字包：複習佇列與弱點出題都吃得到
    try { localStorage.setItem("vb-custom", JSON.stringify(custom)); } catch(e){}
    const fresh = ok.filter(w => !queue.includes(w));          // 已在隊上的（匯過又忘掉）不重複排
    fresh.forEach(w => { stateOf(w); queue.push(w); });        // 新字今天就到期，立刻進隊
    total += fresh.length;                                     // 進度條分母跟著長
    if (!cur || queue.length === fresh.length) next(); else stats();   // 複習到一半只更新張數，不把眼前的卡翻回正面
    box.textContent = "已匯入 " + ok.length + " 個單字：" + ok.map(w => w.en).join("、");
    $("csvText").value = "";
  } else {
    box.textContent = "沒有可匯入的單字。";
  }
  errors.forEach(e => {                                        // 錯誤逐行回報，不影響合法行
    const s = document.createElement("span");
    s.className = "bad";
    s.textContent = "\n第 " + e.line + " 行：" + e.reason;
    box.appendChild(s);
  });
}

// 用途：一鍵移除所有匯入的自訂單字（學習紀錄保留）；重新載入是最簡單可靠的「重算佇列」
function clearImported(){
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem("vb-custom")) || []; } catch(e){}
  if (!custom.length){ $("csvMsg").textContent = "沒有匯入過的單字。"; return; }
  if (!confirm("移除 " + custom.length + " 個匯入的單字？學習紀錄會保留。")) return;
  try { localStorage.setItem("vb-custom", "[]"); } catch(e){}
  location.reload();
}

next();

// 用途：新版 service worker 接手後彈底部提示——人點「重新整理」才換頁，不打斷眼前正在複習的卡
function showUpdateToast(){
  const t = $("updateToast");
  if (!t.hidden) return;
  t.hidden = false;
  void t.offsetWidth;      // 先讓 display 生效，transition 才接得上
  t.classList.add("on");
}

// 註冊 service worker；偵測到新版已接手就彈「有新版本」提示，重載時機由人決定（file:// 不註冊也不噴錯）
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let firstTakeover = !navigator.serviceWorker.controller;   // 首次安裝的接手不算「有新版本」
  navigator.serviceWorker.register("sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) return showUpdateToast();   // 已有等待中的新版
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (nw) nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdateToast();
      });
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "vb-activated"){
      if (firstTakeover){ firstTakeover = false; return; }   // 自己這次的首次安裝
      showUpdateToast();
    }
  });
}
